  <title>JH-Toolkit Skill</title>
  <desc>
    A custom skill icon created for JH-Toolkit, featuring
    its mascot, Oree the duck, alongside the C++ lettering.
    The entire color palette is derived from Oree's original colors.
  </desc>
  <metadata>
    Project: JH-Toolkit
    Project URL: https://github.com/JeongHan-Bae/JH-Toolkit

    Purpose: Custom C++ skill icon for JH-Toolkit.
    Mascot: Oree the duck, the official mascot of JH-Toolkit.
    Design: Combines Oree with C++ lettering.
    Color Palette: Exclusively based on Oree's original colors.

    License: Apache License 2.0
    Distribution: Subject to the same license as JH-Toolkit.
    License URL: https://github.com/JeongHan-Bae/JH-Toolkit/blob/main/LICENSE

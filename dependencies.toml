[project]
name = "jh-toolkit"
version = "1.4.1"
cxx_standard = "20"
description = "An engineering-oriented C++20 toolkit with duck-typed concepts, header-only, RTTI-free, and concurrency-friendly."
supported_platforms = [ "ubuntu", "macos", "windows" ]

[project.source]
repository = "https://github.com/JeongHan-Bae/JH-Toolkit"
download = "git clone https://github.com/JeongHan-Bae/JH-Toolkit.git"

[[components]]
name = "jh-toolkit"
version = "1.4.1"
major_version = 1
cmake = "CMakeLists.txt"


name: Generate and Deploy Doxygen

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  doxygen:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Doxygen helper dependencies
        run: |
          npm ci --prefix .github/workflows/metadata_scripts --no-audit --no-fund
          npm ci --prefix .github/workflows/doxy_scripts --no-audit --no-fund

      - name: Verify Doxygen helpers
        run: |
          npm run typecheck --prefix .github/workflows/doxy_scripts
          npm test --prefix .github/workflows/doxy_scripts

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install Doxygen (brew)
        run: |
          brew update
          brew install doxygen graphviz
          doxygen --version

      - name: Build Doxygen site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/doxy_scripts/build.ts

      - name: Deploy to doxy_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: doxy_pages
          publish_dir: ./.doxy-build/site/html
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "docs: update doxygen for ${{ env.PROJECT_VERSION }}"

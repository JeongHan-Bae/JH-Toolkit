name: Update Dependencies

on:
  push:
    branches:
      - main
      - '*dev'
      - 'dev*'
    paths:
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'include/**'
      - 'tiny-test/include/**'
      - 'simple-cucumber/include/**'
      - 'simple-cucumber/gherkin/include/**'
      - 'dependencies.toml'
      - '.github/workflows/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/update-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cmake-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    # Preserve repository's existing policy: only the owner can push auto-updates.
    if: github.actor == 'JeongHan-Bae'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install metadata parser dependencies
        run: npm ci --prefix .github/workflows/scripts --no-audit --no-fund

      - name: Verify metadata parser
        run: |
          npm run typecheck --prefix .github/workflows/scripts
          npm test --prefix .github/workflows/scripts

      - name: Generate dependencies and badges
        env:
          JH_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node .github/workflows/scripts/generate_dependencies.ts

      - name: Detect changes
        id: diff
        run: |
          git add dependencies.toml \
            assets/metadata/version_badge.json \
            assets/metadata/simple_cucumber_version_badge.json \
            assets/metadata/tiny_test_version_badge.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure commit identity and optional SSH signing
        if: steps.diff.outputs.changed == 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          git config user.name 'JeongHan-Bae'
          git config user.email 'mastropseudo@gmail.com'
          if [ -n "$SSH_SIGNING_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/id_ed25519_signing
            chmod 600 ~/.ssh/id_ed25519_signing
            git config gpg.format ssh
            git config user.signingkey ~/.ssh/id_ed25519_signing
            git config commit.gpgsign true
          fi

      - name: Commit and push metadata
        if: steps.diff.outputs.changed == 'true'
        run: |
          version=$(node .github/workflows/scripts/generate_dependencies.ts --get-version)
          git commit -m "auto-update(version): ${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
